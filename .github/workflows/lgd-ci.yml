name: LGD CI

# 该仓已有自己的 CI（lgd-ci-gate / test），共享 CI 只做布局与 JSON 卫生检查。
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: LGD-AI/lgd-ci/.github/workflows/lgd-reusable-ci.yml@ec5acc84446827ff26b1ef853a339b28e4933dbf
    with:
      python-version: "3.11"
      run-tests: false
      require-skill-md: false